<style>
:root{
  color-scheme:dark;
  --ink:#1c1a20; --shu:#e2472c; --blue:#2f6fbf; --gold:#f0c04a; --cream:#f2efe6; --green:#35d873; --page:#16100c;
  --pop:"Mochiy Pop One","Hiragino Maru Gothic ProN","M PLUS Rounded 1c","Yu Gothic",sans-serif;
  --maru:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic","Meiryo",sans-serif;
  --ad-h:50px;      /* 広告バナーの高さ（スマホ） */
  --ad-gap:60px;    /* バナーとゲームの間の余白。画面の大きさに合わせて、スクリプト（adLayout）が 60〜150px の間で決め直す */
}
@media (orientation: landscape) and (min-width: 728px) and (min-height: 500px){:root{--ad-h:90px}}   /* 横長の画面（パソコンなど）ではバナーを90pxに */
html,body{margin:0;height:100%;background:var(--page);color:#fff;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
/* ゲームの場所：ノッチより下・バナーと余白より上。その中に、縦長のゲーム画面（#stage）をまん中に置く */
#app{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);bottom:calc(var(--ad-h) + env(safe-area-inset-bottom,0px) + var(--ad-gap));display:flex;align-items:center;justify-content:center}
#stage{position:relative;overflow:hidden;background:#2a2420;touch-action:none;outline:none;contain:strict;width:360px;height:480px}
#c{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
#ui{position:absolute;left:0;top:0;width:360px;height:480px;transform-origin:0 0;font-family:var(--maru);font-weight:800;pointer-events:none}
#ui button,#ui a{pointer-events:auto;font-family:inherit;cursor:pointer;-webkit-appearance:none;appearance:none;touch-action:manipulation}
.hide{display:none!important}
.ov{position:absolute;left:0;top:0;right:0;bottom:0}
.ol{text-shadow:0 3px 0 rgba(0,0,0,.5),-2px 0 0 #2a1c14,2px 0 0 #2a1c14,0 -2px 0 #2a1c14,0 2px 0 #2a1c14,-2px -2px 0 #2a1c14,2px -2px 0 #2a1c14,-2px 2px 0 #2a1c14,2px 2px 0 #2a1c14}
.ol2{text-shadow:0 2px 0 rgba(0,0,0,.5),-1.5px 0 0 #2a1c14,1.5px 0 0 #2a1c14,0 -1.5px 0 #2a1c14,0 1.5px 0 #2a1c14,-1px -1px 0 #2a1c14,1px -1px 0 #2a1c14,-1px 1px 0 #2a1c14,1px 1px 0 #2a1c14}
/* ▼広告バナーの場所（ゲームとは別の、いちばん下の帯） */
#ad-zone{position:fixed;left:0;right:0;bottom:0;z-index:10;height:var(--ad-h);padding-bottom:env(safe-area-inset-bottom,0px);background:#100b08;box-shadow:0 -1px 0 rgba(240,192,74,.16)}
#ad-banner{width:100%;height:var(--ad-h);overflow:hidden;display:flex;align-items:center;justify-content:center}

/* ---------- 遊んでいる間の表示 ---------- */
.chip{position:absolute;box-sizing:border-box;background:rgba(28,26,32,.86);border:1px solid rgba(240,192,74,.6);border-radius:12px;box-shadow:0 2px 0 rgba(0,0,0,.28);contain:layout paint}
#st{left:10px;top:10px;width:146px;height:40px;white-space:nowrap;overflow:hidden}
#st small{position:absolute;left:9px;top:6px;font-size:9px;line-height:1;color:var(--gold);letter-spacing:.06em}
#stn{position:absolute;left:8px;bottom:5px;font-family:var(--pop);font-weight:400;font-size:19px;line-height:1}
#stn i{font-style:normal;font-size:10.5px;color:#d9cfc0;margin-left:1px}
#stt{position:absolute;left:44px;right:6px;top:0;height:40px;line-height:38px;font-size:14px;text-align:center;overflow:hidden}
#tm{left:162px;top:10px;width:96px;height:40px;white-space:nowrap}
#tm svg{position:absolute;left:6px;top:6px;width:28px;height:28px}
#tm b{position:absolute;left:38px;right:6px;top:-3px;line-height:36px;text-align:center;font-family:var(--pop);font-weight:400;font-size:21px;font-variant-numeric:tabular-nums}
#tm small{position:absolute;left:33px;right:3px;bottom:3px;font-size:8px;letter-spacing:-.03em;line-height:1;text-align:center;color:#d9cfc0;white-space:nowrap}
#tm.low b{color:#ffe14a}#tm.low{border-color:#ffe14a}
#camb{position:absolute;right:52px;top:10px;width:42px;height:40px;padding:0;border-radius:12px;border:1px solid rgba(240,192,74,.6);background:rgba(28,26,32,.86);color:#fff;box-shadow:0 2px 0 rgba(0,0,0,.28)}
#camb svg{position:absolute;left:9px;top:5px;width:24px;height:18px}
#camb small{position:absolute;left:0;right:0;bottom:4px;font-size:9px;line-height:1;color:var(--gold);white-space:nowrap}
#camb:after,#mute:after{content:"";position:absolute;left:-5px;right:-5px;top:-8px;bottom:-8px}      /* 押せる範囲を少し広く */
#mute{position:absolute;right:10px;top:10px;width:36px;height:40px;padding:0;border-radius:12px;border:1px solid rgba(240,192,74,.6);background:rgba(28,26,32,.86);color:#fff;font-size:17px;line-height:38px;box-shadow:0 2px 0 rgba(0,0,0,.28)}
#mute.off{color:rgba(255,255,255,.35)}#mute.off:before{content:"";position:absolute;left:7px;right:7px;top:19px;height:2px;background:#ff6a4d;transform:rotate(-38deg);border-radius:1px}
/* とくい技の札（左下） */
#abil{position:absolute;left:10px;bottom:10px;display:flex;gap:6px}
#abil span{display:block;padding:5px 9px 6px;border-radius:11px;background:rgba(28,26,32,.78);border:1px solid rgba(255,255,255,.22);font-size:11px;line-height:1.15;color:#d9cfc0;white-space:nowrap}
#abil span i{display:block;font-style:normal;font-size:8.5px;color:#a89f92;letter-spacing:.04em}
#abil .on{background:rgba(53,216,115,.9);border-color:#bff5d0;color:#10301c}#abil .on i{color:#1d5a35}
#abil .cd{opacity:.45}
/* 指を置いた場所（スティック） */
#joy{position:absolute;left:0;top:0;width:92px;height:92px;margin:-46px 0 0 -46px;border-radius:50%;border:2px solid rgba(255,255,255,.5);background:rgba(255,255,255,.08);opacity:0;transition:opacity .12s}
#joy.on{opacity:1}
#joy i{position:absolute;left:50%;top:50%;width:38px;height:38px;margin:-19px 0 0 -19px;border-radius:50%;background:rgba(255,255,255,.75);box-shadow:0 2px 0 rgba(0,0,0,.3)}
/* 見られそう！の赤いふち */
#warn{position:absolute;left:0;top:0;right:0;bottom:0;pointer-events:none}
#warn i{position:absolute;opacity:0}
#warn .l{left:0;top:0;bottom:0;width:46px;background:linear-gradient(to right,rgba(255,40,20,.75),rgba(255,40,20,0))}
#warn .r{right:0;top:0;bottom:0;width:46px;background:linear-gradient(to left,rgba(255,40,20,.75),rgba(255,40,20,0))}
#warn .t{left:0;right:0;top:0;height:46px;background:linear-gradient(to bottom,rgba(255,40,20,.75),rgba(255,40,20,0))}
#warn .b{left:0;right:0;bottom:0;height:46px;background:linear-gradient(to top,rgba(255,40,20,.75),rgba(255,40,20,0))}
/* 吹き出し（せりふ）と「？」ゲージ */
#bub{position:absolute;left:0;top:0;right:0;bottom:0;pointer-events:none}
.say{position:absolute;left:0;top:0;transform:translate(-50%,-100%);padding:5px 10px 6px;border-radius:12px;background:#fff;color:#2a1c14;font-size:12.5px;line-height:1.3;white-space:nowrap;box-shadow:0 2px 0 rgba(0,0,0,.3);opacity:0;transition:opacity .15s}
.say:after{content:"";position:absolute;left:50%;bottom:-7px;margin-left:-6px;border-left:6px solid transparent;border-right:6px solid transparent;border-top:8px solid #fff}
.say.on{opacity:1}.say.hot{background:#ffe14a}
.q{position:absolute;left:0;top:0;width:30px;height:30px;margin:-15px 0 0 -15px;opacity:0}
.q.on{opacity:1}
.q svg{width:30px;height:30px;display:block}
.q b{position:absolute;left:0;right:0;top:0;line-height:30px;text-align:center;font-family:var(--pop);font-weight:400;font-size:17px;color:#2a1c14}
.q.alarm b{color:#fff}
/* 手ほどき（下のほう） */
#tip{position:absolute;left:0;right:0;bottom:52px;text-align:center;opacity:0;transition:opacity .2s}
#tip.on{opacity:1}
#tip span{display:inline-block;padding:6px 14px 7px;border-radius:14px;background:rgba(28,26,32,.86);border:1px solid rgba(240,192,74,.7);font-size:13px;line-height:1.35;color:#fff;white-space:nowrap}
#tip span b{color:#ffe14a}
/* ステージの始まりの札 */
#card{position:absolute;left:0;right:0;top:24%;padding:12px 0 14px;text-align:center;background:linear-gradient(to right,rgba(22,14,10,0),rgba(22,14,10,.86) 14%,rgba(22,14,10,.86) 86%,rgba(22,14,10,0));opacity:0}
#card small{display:block;font-size:13px;line-height:1.2;color:var(--gold);letter-spacing:.2em;text-indent:.2em}
#card b{display:block;margin:4px 0 2px;font-family:var(--pop);font-weight:400;font-size:40px;line-height:1.15;color:#fff;white-space:nowrap}
#card em{display:block;font-style:normal;font-size:12px;line-height:1.3;color:#d9cfc0}
#card i{display:block;margin-top:8px;font-style:normal;font-size:16px;line-height:1.3;color:#ffe27a}
#card u{display:block;margin-top:4px;text-decoration:none;font-size:12px;line-height:1.3;color:#fff}
#card.go{animation:card 2.3s ease-out forwards}
@keyframes card{0%{opacity:0;transform:translateX(-40px)}10%{opacity:1;transform:none}84%{opacity:1;transform:none}100%{opacity:0;transform:translateX(26px)}}
/* まん中のお知らせ */
#msg{position:absolute;left:0;right:0;top:33%;text-align:center;opacity:0;font-family:var(--pop);font-weight:400}
#msg .t{display:block;font-size:46px;line-height:1.15;letter-spacing:.04em}
#msg .c{display:block;margin-top:6px;font-family:var(--maru);font-weight:800;font-size:15px;line-height:1.35;color:#fff}
#msg.warn .t{color:#ffc24a;font-size:30px}#msg.found .t{color:#ff6a4d}#msg.esc .t{color:#8cf5a8;font-size:34px}#msg.caught .t{color:#ff8d78}#msg.clear .t{color:#ffe14a}
#msg.in{animation:msgin .32s cubic-bezier(.2,1.5,.5,1) forwards}
#msg.out{animation:msgout .4s ease-in forwards}
@keyframes msgin{0%{opacity:0;transform:scale(1.7)}100%{opacity:1;transform:scale(1)}}
@keyframes msgout{0%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
#fl{position:absolute;left:0;top:0;right:0;bottom:0;background:#fff;opacity:0}
#fl.go{animation:fl .4s ease-out forwards}#fl.red{background:#ff3a2a}
@keyframes fl{0%{opacity:.7}100%{opacity:0}}

/* ---------- タイトル ---------- */
#title{background:linear-gradient(to bottom,rgba(22,14,10,.78) 0,rgba(22,14,10,.25) 34%,rgba(22,14,10,0) 46%,rgba(22,14,10,.66) 70%,rgba(22,14,10,.9) 100%)}
#logo{position:absolute;left:0;right:0;top:52px;margin:0;text-align:center;font-family:var(--pop);font-weight:400;line-height:1.05;transform:rotate(-2deg)}
#logo span{display:inline-block;font-size:40px;color:#fff;white-space:nowrap;text-shadow:-2.5px 0 0 #2a1c14,2.5px 0 0 #2a1c14,0 -2.5px 0 #2a1c14,0 2.5px 0 #2a1c14,-2px -2px 0 #2a1c14,2px -2px 0 #2a1c14,-2px 2px 0 #2a1c14,2px 2px 0 #2a1c14,0 6px 0 #2a1c14,2px 6px 0 #2a1c14,-2px 6px 0 #2a1c14}
#logo .b{color:var(--cream)}#logo .b em{font-style:normal;color:#ff7a5c}
#logo small{display:block;margin-top:8px;font-family:var(--maru);font-weight:800;font-size:14px;color:#fff;letter-spacing:.08em;text-shadow:0 2px 0 rgba(0,0,0,.6)}
#logo .lc{display:inline-block;margin-left:6px;padding:2px 7px 3px;border-radius:8px;background:#fff;color:#2a1c14;font-family:var(--maru);font-weight:800;font-size:12px;line-height:1.2;vertical-align:12px;transform:rotate(6deg);text-shadow:none}
#how{position:absolute;left:18px;right:18px;bottom:122px;padding:10px 12px 9px;border-radius:14px;background:rgba(28,26,32,.84);border:1px solid rgba(240,192,74,.55);font-size:12px;line-height:1.45;color:#fff}
#how p{margin:0 0 3px;padding-left:26px;position:relative}
#how p i{position:absolute;left:0;top:1px;width:19px;height:19px;border-radius:50%;background:var(--shu);font-style:normal;font-family:var(--pop);font-weight:400;font-size:11px;line-height:19px;text-align:center}
#how b{color:#ffe27a;font-weight:800}
#best0{position:absolute;left:0;right:0;bottom:98px;text-align:center;font-size:11.5px;color:var(--gold);text-shadow:0 1px 0 rgba(0,0,0,.6)}
#go{position:absolute;left:18px;bottom:30px;width:200px;height:56px;border-radius:28px;border:3px solid #2a1c14;background:linear-gradient(#ff7a5c,#e2472c);color:#fff;font-family:var(--pop);font-weight:400;font-size:24px;box-shadow:0 5px 0 #7a2416}
#go:active{transform:translateY(3px);box-shadow:0 2px 0 #7a2416}
#prb{position:absolute;right:18px;bottom:30px;width:118px;height:56px;border-radius:28px;border:3px solid #2a1c14;background:linear-gradient(#5d93cc,#2f6fbf);color:#fff;font-family:var(--pop);font-weight:400;font-size:16px;line-height:1.1;box-shadow:0 5px 0 #173a66}
#prb small{display:block;font-family:var(--maru);font-weight:800;font-size:9.5px;color:#d8e8ff}
#prb:disabled{background:#4a4650;color:#8d8794;box-shadow:0 5px 0 #2a2730;cursor:default}#prb:disabled small{color:#8d8794}
.cr{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-size:9.5px;letter-spacing:.14em;color:rgba(255,255,255,.45)}
#load{position:absolute;left:0;right:0;top:46%;text-align:center;font-size:14px;color:#d9cfc0}
/* 練習 */
#prac{background:rgba(16,11,8,.9)}
#prac h2{margin:64px 0 6px;text-align:center;font-family:var(--pop);font-weight:400;font-size:26px}
#prac p{margin:0 0 12px;text-align:center;font-size:11.5px;color:#d9cfc0}
#plist{position:absolute;left:24px;right:24px;top:132px;display:grid;grid-template-columns:1fr 1fr;gap:9px}
#plist button{height:50px;border-radius:14px;border:2px solid #2a1c14;background:var(--cream);color:#2a1c14;font-size:13px;line-height:1.2;box-shadow:0 3px 0 rgba(0,0,0,.4)}
#plist button small{display:block;font-size:9.5px;color:#7a6a5a}
#plist button:disabled{background:#4a4650;color:#8d8794;box-shadow:none;cursor:default}
#pback{position:absolute;left:50%;bottom:28px;width:150px;margin-left:-75px;height:46px;border-radius:23px;border:2px solid rgba(255,255,255,.5);background:rgba(28,26,32,.9);color:#fff;font-size:14px}
/* 結果 */
#res{background:rgba(16,11,8,.62)}
#rcard{position:absolute;left:24px;right:24px;top:58px;padding:16px 14px 14px;border-radius:18px;background:var(--cream);color:#2a1c14;text-align:center;box-shadow:0 6px 0 rgba(0,0,0,.35)}
#rh{font-family:var(--pop);font-weight:400;font-size:28px;line-height:1.2}
#rh.win{color:var(--shu)}
#rw{margin-top:6px;font-size:13px;line-height:1.45}
#rw b{color:var(--shu)}
#rt{margin-top:10px;font-size:11px;color:#7a6a5a}
#rtv{font-family:var(--pop);font-weight:400;font-size:34px;line-height:1.1}
#rtv small{font-family:var(--maru);font-weight:800;font-size:13px;margin:0 3px}
#rk{margin-top:10px;padding-top:9px;border-top:2px dashed rgba(42,28,20,.2);font-size:11px;color:#7a6a5a}
#rkv{display:block;margin-top:2px;font-family:var(--pop);font-weight:400;font-size:20px;color:#2a1c14}
#nb{display:inline-block;margin-bottom:6px;padding:3px 12px 4px;border-radius:12px;background:var(--gold);color:#4a2c08;font-size:12px}
#btns{position:absolute;left:24px;right:24px;bottom:78px;display:flex;gap:10px}
.btn{flex:1;height:52px;border-radius:26px;border:3px solid #2a1c14;color:#fff;font-family:var(--pop);font-weight:400;font-size:17px;line-height:46px;text-align:center;text-decoration:none;box-sizing:border-box}
#retry{background:linear-gradient(#ff7a5c,#e2472c);box-shadow:0 4px 0 #7a2416}
#share{background:#1c1a20;box-shadow:0 4px 0 #000}
#home{position:absolute;left:50%;bottom:26px;width:150px;margin-left:-75px;height:42px;border-radius:21px;border:2px solid rgba(255,255,255,.5);background:rgba(28,26,32,.9);color:#fff;font-size:13px}
</style>

<body>
<div id="app">
  <div id="stage" tabindex="-1">
    <canvas id="c"></canvas>
    <div id="ui">
      <div id="warn"><i class="l"></i><i class="r"></i><i class="t"></i><i class="b"></i></div>
      <div id="bub"></div>
      <div id="hud" class="hide">
        <div id="st" class="chip"><small>ステージ</small><b id="stn">1<i>/8</i></b><span id="stt">人の靴下</span></div>
        <div id="tm" class="chip"><svg viewBox="0 0 28 28"><circle cx="14" cy="14" r="11" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="4"/><circle id="tmr" cx="14" cy="14" r="11" fill="none" stroke="#a8ffc4" stroke-width="4" stroke-linecap="round" stroke-dasharray="69.1" stroke-dashoffset="0" transform="rotate(-90 14 14)"/></svg><b id="tmv">60</b><small>あきらめるまで</small></div>
        <button id="camb" aria-label="カメラの切りかえ"><svg viewBox="0 0 24 18"><rect x="1" y="4" width="16" height="12" rx="3" fill="none" stroke="#fff" stroke-width="2"/><path d="M17 8l6-3v10l-6-3z" fill="#fff"/></svg><small id="caml">ななめ</small></button>
        <div id="abil"><span id="ab1">ぺたんこ<i>タップ</i></span><span id="ab2">ダッシュ<i>はじく</i></span></div>
        <div id="tip"><span id="tipt"></span></div>
        <div id="joy"><i></i></div>
      </div>
      <div id="fl"></div>
      <div id="card"><small id="cdn"></small><b id="cdt"></b><em id="cdr"></em><i id="cdg"></i><u id="cdh"></u></div>
      <div id="msg"></div>
      <div id="title" class="ov hide">
        <h1 id="logo"><span>さがさないで</span><br><span class="b">ください<span class="lc hide">仮</span></span><small>―― 片方の靴下より</small></h1>
        <div id="how">
